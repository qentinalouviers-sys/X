<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="dark">
<title>Connexion</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100dvh; display: grid; place-items: center;
    background: #0a0a0a; color: #e5e5e5; padding: 1.5rem;
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  form { width: 100%; max-width: 22rem; }
  h1 { font-size: 1.05rem; font-weight: 600; margin: 0 0 .25rem; }
  p.sub { margin: 0 0 1.25rem; font-size: .8rem; color: #737373; }
  label { display: block; font-size: .8rem; color: #a3a3a3; margin-bottom: .4rem; }
  input {
    width: 100%; padding: .7rem .8rem; font-size: 16px; color: #f5f5f5;
    background: #171717; border: 1px solid #333; border-radius: .6rem; outline: none;
  }
  input:focus { border-color: #0284c7; }
  button {
    width: 100%; margin-top: .85rem; padding: .7rem; font-size: .9rem; font-weight: 500;
    color: #fff; background: #0284c7; border: 0; border-radius: .6rem; cursor: pointer;
  }
  button:hover { background: #0369a1; }
  .error {
    margin: 0 0 1rem; padding: .6rem .75rem; font-size: .8rem; border-radius: .5rem;
    color: #fca5a5; background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.3);
  }
</style>
</head>
<body>
  <form method="POST" action="/auth/login" autocomplete="on">
    <h1>llm-chat</h1>
    <p class="sub">Instance privée. Accès protégé par mot de passe.</p>
    <!--ERROR-->
    <label for="password">Mot de passe</label>
    <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
    <input type="hidden" name="next" value="<!--NEXT-->">
    <button type="submit">Se connecter</button>
  </form>
</body>
</html>
